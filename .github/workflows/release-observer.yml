name: Release Observer

on:
  push:
    tags:
      - 'observer/v*'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF_NAME#observer/}" >> $GITHUB_OUTPUT

      - name: Set version in package.json
        working-directory: observer
        run: jq --arg v "${{ steps.version.outputs.tag }}" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Install dependencies
        working-directory: observer
        run: bun install

      - name: Build
        working-directory: observer
        run: bun run build

      - name: Deploy to Cloudflare Workers
        working-directory: observer
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git tag -l 'observer/v*' --sort=-v:refname | sed -n '2p')

          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges -- observer/)
          else
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges -- observer/)
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No changes in observer/ since last release"
          fi

          {
            echo "## NinjaParty Observer ${{ steps.version.outputs.tag }}"
            echo ""
            echo "### Changelog"
            echo "$CHANGELOG"
          } > changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Observer ${{ steps.version.outputs.tag }}
          body_path: changelog.md
          draft: false
          prerelease: false
