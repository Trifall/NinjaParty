name: Release Relay

on:
  push:
    tags:
      - 'relay/v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libayatana-appindicator3-dev gcc-mingw-w64

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF_NAME#relay/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          CHANGELOG_PATH="$RUNNER_TEMP/relay-changelog.md"
          PREVIOUS_TAG=$(git tag -l 'relay/v*' --sort=-v:refname | sed -n '2p')

          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" --no-merges -- relay/)
          else
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" --no-merges -- relay/)
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No changes in relay/ since last release"
          fi

          {
            echo "## NinjaParty Relay ${{ steps.version.outputs.tag }}"
            echo ""
            echo "$CHANGELOG"
          } > "$CHANGELOG_PATH"

          echo "path=$CHANGELOG_PATH" >> $GITHUB_OUTPUT

      - name: Prepare GoReleaser tags
        id: goreleaser_tags
        run: |
          CURRENT_TAG="${{ steps.version.outputs.tag }}"
          RELEASE_TAG="${GITHUB_REF_NAME}"
          PREVIOUS_PREFIXED_TAG=$(git tag -l 'relay/v*' --sort=-v:refname | sed -n '2p')

          git tag "$CURRENT_TAG" "$GITHUB_SHA"

          if [ -n "$PREVIOUS_PREFIXED_TAG" ]; then
            PREVIOUS_TAG="${PREVIOUS_PREFIXED_TAG#relay/}"
            git tag "$PREVIOUS_TAG" "$PREVIOUS_PREFIXED_TAG"
            echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          fi

          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

      - name: Run GoReleaser (Linux & Windows)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean -f relay/.goreleaser.yaml --release-notes "${{ steps.changelog.outputs.path }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.goreleaser_tags.outputs.current_tag }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.goreleaser_tags.outputs.previous_tag }}
          GORELEASER_RELEASE_TAG: ${{ steps.goreleaser_tags.outputs.release_tag }}

  goreleaser-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF_NAME#relay/}" >> $GITHUB_OUTPUT

      - name: Prepare GoReleaser tags
        id: goreleaser_tags
        run: |
          CURRENT_TAG="${{ steps.version.outputs.tag }}"
          RELEASE_TAG="${GITHUB_REF_NAME}"
          PREVIOUS_PREFIXED_TAG=$(git tag -l 'relay/v*' --sort=-v:refname | sed -n '2p')

          git tag "$CURRENT_TAG" "$GITHUB_SHA"

          if [ -n "$PREVIOUS_PREFIXED_TAG" ]; then
            PREVIOUS_TAG="${PREVIOUS_PREFIXED_TAG#relay/}"
            git tag "$PREVIOUS_TAG" "$PREVIOUS_PREFIXED_TAG"
            echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          fi

          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

      - name: Run GoReleaser (macOS)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --clean -f relay/.goreleaser.yaml --id relay-darwin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.goreleaser_tags.outputs.current_tag }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.goreleaser_tags.outputs.previous_tag }}
          GORELEASER_RELEASE_TAG: ${{ steps.goreleaser_tags.outputs.release_tag }}
          
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-macos
          path: relay/dist/relay-darwin_darwin_*/NinjaParty-Relay*

  attach-macos:
    needs: [goreleaser, goreleaser-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: relay-macos
          path: macos-dist/

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" macos-dist/** --repo "$GITHUB_REPOSITORY"
