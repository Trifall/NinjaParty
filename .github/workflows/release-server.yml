name: Release Server

on:
  push:
    tags:
      - 'server/v*'

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ vars.SERVER_DOCKER_IMAGE || 'jerrent/ninjaparty-server' }}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: server/go.sum

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF_NAME#server/}" >> $GITHUB_OUTPUT

      - name: Resolve release commit
        id: release_commit
        run: |
          COMMIT_SHA=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          echo "sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "date=$(git show -s --format=%cI "$COMMIT_SHA")" >> $GITHUB_OUTPUT

      - name: Extract build metadata
        id: build_meta
        run: |
          echo "commit_sha=${{ steps.release_commit.outputs.sha }}" >> $GITHUB_OUTPUT
          echo "commit_date=${{ steps.release_commit.outputs.date }}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          CHANGELOG_PATH="$RUNNER_TEMP/server-changelog.md"
          PREVIOUS_TAG=$(git tag -l 'server/v*' --sort=-v:refname | sed -n '2p')

          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" --no-merges -- server/)
          else
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" --no-merges -- server/)
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No changes in server/ since last release"
          fi

          {
            echo "## NinjaParty Server ${{ steps.version.outputs.tag }}"
            echo ""
            echo "$CHANGELOG"
          } > "$CHANGELOG_PATH"

          echo "path=$CHANGELOG_PATH" >> $GITHUB_OUTPUT

      - name: Prepare GoReleaser tags
        id: goreleaser_tags
        run: |
          CURRENT_TAG="${{ steps.version.outputs.tag }}"
          RELEASE_TAG="${GITHUB_REF_NAME}"
          PREVIOUS_PREFIXED_TAG=$(git tag -l 'server/v*' --sort=-v:refname | sed -n '2p')
          RELEASE_COMMIT="${{ steps.release_commit.outputs.sha }}"

          git tag "$CURRENT_TAG" "$RELEASE_COMMIT"

          if [ -n "$PREVIOUS_PREFIXED_TAG" ]; then
            PREVIOUS_TAG="${PREVIOUS_PREFIXED_TAG#server/}"
            git tag "$PREVIOUS_TAG" "$PREVIOUS_PREFIXED_TAG"
            echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          fi

          echo "current_tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish --skip=announce -f server/.goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.goreleaser_tags.outputs.current_tag }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.goreleaser_tags.outputs.previous_tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.tag, '-') }}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT=${{ steps.build_meta.outputs.commit_sha }}
            DATE=${{ steps.build_meta.outputs.commit_date }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          push-to-registry: true

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.path }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TITLE: NinjaParty Server ${{ steps.version.outputs.tag }}
        run: |
          files=()
          for f in server/dist/*; do
            if [ -f "$f" ]; then
              files+=("$f")
            fi
          done

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Notify release
        if: success()
        run: |
          echo "Release ${{ github.ref_name }} created successfully"
          echo "Docker image: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}"
          if [[ "${{ steps.version.outputs.tag }}" != *-* ]]; then
            echo "Docker image: ${{ env.IMAGE_NAME }}:latest"
          fi
