name: Release Server

on:
  push:
    tags:
      - 'server/v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF_NAME#server/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          CHANGELOG_PATH="$RUNNER_TEMP/server-changelog.md"
          PREVIOUS_TAG=$(git tag -l 'server/v*' --sort=-v:refname | sed -n '2p')

          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" --no-merges -- server/)
          else
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" --no-merges -- server/)
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No changes in server/ since last release"
          fi

          {
            echo "## NinjaParty Server ${{ steps.version.outputs.tag }}"
            echo ""
            echo "$CHANGELOG"
          } > "$CHANGELOG_PATH"

          echo "path=$CHANGELOG_PATH" >> $GITHUB_OUTPUT

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean -f server/.goreleaser.yaml --release-notes "${{ steps.changelog.outputs.path }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
